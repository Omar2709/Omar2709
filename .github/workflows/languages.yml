
name: Most Used Languages

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/languages.yml"

permissions:
  contents: write

concurrency:
  group: language-metrics
  cancel-in-progress: true

jobs:
  languages:
    name: Generate language statistics
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate most used languages
        uses: lowlighter/metrics@latest
        with:
          # Autenticación y usuario
          token: ${{ secrets.METRICS_TOKEN }}
          user: Omar2709

          # Archivo de salida
          filename: assets/metrics.languages.svg

          # Solo repositorios propios
          # Excluye colaboraciones externas y forks
          repositories_affiliations: owner
          repositories_forks: no

          # No incluir estadísticas generales
          base: ""

          # Configuración
          config_timezone: America/Bogota

          # Mostrar únicamente lenguajes
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: no

          # Publicación automática
          output_action: commit
          output_condition: data-changed
          committer_branch: main
          committer_message: "chore: update language metrics [skip ci]"
