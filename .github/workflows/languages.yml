
name: Most Used Languages

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/languages.yml"

permissions:
  contents: write

concurrency:
  group: language-metrics
  cancel-in-progress: true

jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate language statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Omar2709

          filename: assets/metrics.languages.svg

          # No mostrar seguidores ni estadísticas generales
          base: ""

          config_timezone: America/Bogota

          # Mostrar únicamente el gráfico de lenguajes
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_languages_sections: most-used

          # Guardar el gráfico automáticamente
          output_action: commit
          output_condition: data-changed
          committer_branch: main
          committer_message: "chore: update language metrics [skip ci]"
